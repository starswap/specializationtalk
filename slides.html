const INT=`package specializationtalk.matrix

// Flat row-major layout: element (i,j) of an n x n matrix is at index i*n+j
class IntMatrix(val elems: Array[Int], val n: Int):
  def apply(i: Int, j: Int): Int = elems(i * n + j)

  def matMul(other: IntMatrix, result: Array[Int]): IntMatrix =
    require(this.n == other.n)
    for
      i <- 0 until n
      k <- 0 until n
    do
      val aik = this(i, k)
      for j <- 0 until n do
        result(i * n + j) += aik * other(k, j)
    IntMatrix(result, n)`;
const GEN=`package specializationtalk.matrix

class GenericMatrix[T: Numeric](val elems: Array[T], val n: Int):
  private val num = summon[Numeric[T]]

  def apply(i: Int, j: Int): T = elems(i * n + j)

  def matMul(other: GenericMatrix[T], result: Array[T]): GenericMatrix[T] =
    require(this.n == other.n)
    for
      i <- 0 until n
      k <- 0 until n
    do
      val aik = this(i, k)
      for j <- 0 until n do
        result(i * n + j) = num.plus(result(i * n + j), num.times(aik, other(k, j)))
    GenericMatrix(result, n)`;
const INL=`inline trait A[T](val x: T):
  def foo: T = x

class B extends A[Int](1)`;
const FOO=`inline trait Foo[T: Specialized](x: T):
  def g: T = x

def f(b: Foo[Int]) = 37 + b.g

def main(args: Array[String]): Unit =
  val x = new Foo[Int](42) {}
  val y = f(x)`;
const SPEC=`package specializationtalk.matrix

«inline trait» SpecializedMatrix[T: {«Specialized», «NumericSpecialized»}](
    val elems: Array[T], val n: Int):
  private val num = summon[NumericSpecialized[T]]

  def apply(i: Int, j: Int): T = elems(i * n + j)

  def matMul(other: SpecializedMatrix[T], result: Array[T]): Array[T] =
    require(this.n == other.n)
    for
      i <- 0 until n
      k <- 0 until n
    do
      val aik = this(i, k)
      for j <- 0 until n do
        result(i * n + j) = num.plus(result(i * n + j), num.times(aik, other(k, j)))
    result`;
const NUM=`inline trait NumericSpecialized[T: Specialized]:
  def fromInt(x: Int): T
  def plus(x: T, y: T): T
  def times(x: T, y: T): T

implicit object IntIsNumeric extends NumericSpecialized[Int]:
  override def fromInt(x: Int): Int = x
  override def plus(x: Int, y: Int): Int = x + y
  override def times(x: Int, y: Int): Int = x * y`;

D("Example: IntMatrix",["Imagine a linear algebra library with a Matrix type that can multiply two matrices.","! Live-code this verbatim:",V(INT)]),
["IntMatrix",C(INT),0,[
"! Show benchmark and then run the benchmark in the editor (<code>scala-cli --power --jmh  .</code>) (MatBench.manual ≈ 21.8 ms/op). Ask for questions while it runs.","300×300 in about 20 ms: ~10⁹ ops/s, about right for a modern CPU with vector instructions. C++ does the same in 4 ms.","But a library of Int-only matrices isn't very useful: we want floats and other numeric types too."],0,1],
D("Example: GenericMatrix",["! Copy IntMatrix and modify it into this verbatim:",V(GEN),"Explain the Numeric typeclass instance and summoning it with summon."]),
["GenericMatrix",C(GEN),0,[
"! Run the same 300×300 Int benchmark (MatBench.generic ≈ 268.7 ms/op).","Ten times slower, and the operation didn't change. Did we make a mistake? Run it again…","That's the point: going generic, even when we use Int at the call site, costs a huge penalty. Why? Erasure.","Show of hands: do we know what erasure is? Do we like it? Quick recap, because JVM compatibility is a core Scala selling point."],0,1],
["Erasure: CPU",`${H('Erasure')}<div class="row">${C('def add[T](a: T, b: T) = a + b','md')}</div><div class="row"><div><div class="lab">Int</div><div class="chip">add eax, ebx</div></div><div><div class="lab">Float</div><div class="chip">addss xmm0, xmm1</div></div></div>`,0,[
"We want to write code against generic type parameters, but the CPU represents different types differently, so one machine-code function usually can't serve several types.","Source code on top, the instruction the CPU actually runs below: adding two ints is a different instruction from adding two floats."]],
["Monomorphisation vs erasure",`<div class="row"><div><div class="lab">Monomorphisation</div><div class="chip">myFunction[Int]</div><div class="chip">myFunction[Float]</div><div class="chip">myFunction[Double]</div></div><div><div class="lab">Erasure</div><div class="chip">myFunction[Object]</div>${C(`int x = 42;                       // primitive
Integer y = Integer.valueOf(42);  // boxed

public final class Integer extends Number {
  private final int value;
  ...
}`,'sm')}</div></div>`,0,[
"Two ways to solve it: make a copy of every function for each type T could be (monomorphisation), or insist on a uniform representation so ints and floats look the same above some level (erasure).","Scala and Java use erasure. Values of type T are Object pointers, so primitives must be boxed (wrapped in an Object like Integer) before generic code can use them."]],
["Generated code: GenericMatrix",`${H('Generated Code - <code>GenericMatrix</code>')}${C(`class GenericMatrix(elems: «Object», n: Int, num: scala.math.Numeric):
  def elems(): Object
  def apply(i: Int, j: Int): «Object» =
    «scala.runtime.ScalaRunTime.array_apply»(this.elems(), i * this.n() + j)

  def matMul(other: GenericMatrix, result: Object): GenericMatrix =
    require(this.n() == other.n())
    (0 until n).foreach(i => (0 until n).foreach(k =>
      val aik: «Object» = this.apply(i, k)
      (0 until n).foreach(j =>
        «ScalaRunTime.array_update»(result, i * n + j,
          «this.num.plus»(«array_apply»(result, i * n + j),
            «this.num.times»(aik, other.apply(k, j))))))
    new GenericMatrix(result, n, num)`,'sm')}`,0,[
"Every element is treated as an Object.","Arrays are generic arrays of Objects, accessed via ScalaRunTime (reflection-style).","We make method calls for add and multiply (!) just to unbox the Objects back into primitives."]],

    require(this.n() == other.n())
    (0 until n).foreach(i => (0 until n).foreach(k =>
      val aik: «Int» = this.apply(i, k)
      (0 until n).foreach(j =>
        val i$1: Int = i * n + j

"Manually specialized: actual primitive ints, actual int arrays, primitive + and * instead of method calls.","But we want the expressiveness of generics. Can we get IntMatrix performance with generic types?","Idea: the user writes generic code and the compiler specializes behind the scenes."]],
D("Example: inline traits",["! Run scala-cli examples/inline_traits.scala. Type this verbatim:",V(INL),"A simple starting point: a new kind of trait that specializes when you subclass it."]),
["Inline traits",`${C(INL,'lg')}${C(`// inlines to:
class B extends A[Int](1):
  override val x: Int = 1
  override def foo: Int = this.x`,'lg',1)}`,1,[
"! Show the inlining, then remove `inline` and show what changes.","x and foo have type Int in B: genuinely primitive Ints, not boxed Integers.","Check: does this make sense to everyone?","So if we use B everywhere instead of A[Int] we get specialization via this mechanism. No matter how big A gets, B's source stays empty: we keep generics, no copy-paste."],0,1],
["Interfaces lose specialization",C(`inline trait Foo[T](x: T):
  def g#1: T = x

class Bar extends Foo[Int](42):
  // After inlining
  override def g#2: Int = 42

def f(b: Foo[Int]) = 37 + «b.g#1»

@main def main =
  val x = Bar()
  f(x)`,'lg'),0,[
"Problem 1: we lose specialization at interfaces. b is typed Foo[Int], so b.g calls the unspecialized g#1."]],
["Boilerplate",C(`inline trait Matrix[T](val elems: Array[T], val n: Int):
  ...

class IntMatrix(e: Array[Int], n: Int)
  extends Matrix[Int](e, n)
class FloatMatrix(e: Array[Float], n: Int)
  extends Matrix[Float](e, n)
class DoubleMatrix(e: Array[Double], n: Int)
  extends Matrix[Double](e, n)`,'lg'),0,[
"Problem 2: we must use B everywhere instead of A[Int], so specialization isn't automatic.","Boilerplate for every type (Matrix example), and worse with several type parameters (a product of combinations). "]],
["Generic methods",C(`inline trait Vec[T]
class VecInt extends Vec[Int]

def times[T](x: Vec[T], y: Vec[T])

// even making this method inline does not allow for specialization:
inline def times[T](x: Vec[T], y: Vec[T])`,'lg'),0,[
"Particularly bad for generic methods: we can't get specialization at all, even if the method is inline. More boilerplate we don't want to write by hand. Can the compiler generate it?"]],
["Specialized traits",`<div class="two"><div class="lab">You write</div><div class="lab">Compiler generates</div>${C(`inline trait Foo[T: «Specialized»](x: T):
  def g: T = x`,'m2')}${C(`inline trait Foo$sp$Int extends Foo[Int]:
  override def g: Int`,'m2',1)}${C(`def f(b: Foo[Int]) = 37 + b.g`,'m2')}${C(`def f(b: «Foo$sp$Int») = 37 + b.g`,'m2',2)}${C(`val x = new Foo[Int](42) {}`,'m2')}${C(`val x = new «Foo$impl$Int»(42)`,'m2',3)}<div></div>${C(`class Foo$impl$Int(x: Int)
  extends Foo$sp$Int, Foo[Int](this.x):
  private val Foo$$x: Int = this.x
  override def g: Int = this.Foo$$x`,'m2',3)}</div>`,3,[
"Left column is all the user writes; the Specialized context bound marks the trait.","Step 1: for every Foo[Int] in the program the compiler generates a Foo$sp$Int interface trait, specialized via inline traits.","Step 2: it replaces Foo[Int] with Foo$sp$Int, so member access is specialized.","Step 3: it generates $impl$ classes to replace anonymous instances (and handles value parameters like x)."]],

nt.innerHTML=`<div class="hd">${i+1} / ${S.length} · ${t}</div>`+n.map(x=>x[0]=='!'?`<div class="do"><b>Do</b>${x.slice(2)}</div>`:x[0]=='~'?`<pre class="cn">${hl(x.slice(2).replace(/[«»]/g,''))}</pre>`:`<p class="say">${x}</p>`).join('')+`<p class="nx">Next: ${S[i+1]?S[i+1][0]:'End'}</p>`}
function go(d){if(d>0){if(k<(S[i][2]||0))k++;else if(i<S.length-1){i++;k=0;if(i==1)run=true}}else{if(k>0)k--;else if(i>0){i--;k=S[i][2]||0}}draw()}
function fit(){const p=document.body.classList.contains('pres'),w=innerWidth,h=innerHeight;
const s=p?Math.min(w*.5/1280,(h-100)/720):Math.min(w/1280,h/720);
st.style.transform=`scale(${s})`;
const l=p?24:(w-1280*s)/2,t=p?70:(h-720*s)/2;st.style.left=l+'px';st.style.top=t+'px';
Object.assign(nt.style,{left:(l+1280*s+24)+'px',right:'0',top:'70px',bottom:'0'})}
addEventListener('resize',fit);
addEventListener('keydown',e=>{const c=e.key;
if(c=='ArrowRight'||c==' '||c=='PageDown'){e.preventDefault();go(1)}
else if(c=='ArrowLeft'||c=='PageUp')go(-1);
else if(c=='p'||c=='P'){document.body.classList.toggle('pres');fit()}
else if(c=='t'||c=='T')run=!run;
else if(c=='r'||c=='R'){T=0;run=false}
else if(c=='f'||c=='F'){try{document.documentElement.requestFullscreen()}catch(_){}}});
document.addEventListener('click',e=>{if(!document.body.classList.contains('pres')&&e.target!==tm)go(1)});
tm.onclick=e=>{e.stopPropagation();run=!run};
setInterval(()=>{if(run)T++;tm.textContent=`${Math.floor(T/60)}:${String(T%60).padStart(2,'0')} / 30:00`;tm.className=T>=1800?'over':T>=1500?'warn':''},1000);
fit();draw();
</script></body></html>
